<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>对局服务状态</title>
  <style>
    :root{color-scheme:dark;--bg:#101619;--panel:#192226;--line:#344248;--muted:#9eafb3;--ink:#edf3f2;--accent:#78d6bd;--warn:#ffca7a}
    *{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 10% 0,#203b3b 0,transparent 38%),var(--bg);color:var(--ink);font:15px/1.55 system-ui,"Microsoft YaHei",sans-serif}
    main{width:min(1120px,calc(100% - 32px));margin:36px auto 64px}header{display:flex;align-items:center;gap:14px;margin-bottom:24px}header svg{width:42px;height:42px;color:var(--accent)}h1,h2,p{margin:0}h1{font-size:clamp(24px,4vw,34px);letter-spacing:.03em}h2{font-size:18px;margin-bottom:16px}.sub,.muted{color:var(--muted)}.sub{margin-top:3px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin:20px 0}.card,section{border:1px solid var(--line);background:color-mix(in srgb,var(--panel) 92%,transparent);border-radius:14px}.card{padding:17px}.label{color:var(--muted);font-size:13px}.value{font-size:26px;font-weight:700;margin-top:4px}.unit{font-size:13px;color:var(--muted);font-weight:500}.dot{display:inline-block;width:9px;height:9px;margin-right:7px;border-radius:50%;background:#ff7e75}.dot.up{background:var(--accent);box-shadow:0 0 12px #78d6bd66}section{padding:20px;margin-top:16px}.section-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px}.section-head h2{margin:0}.tag{color:var(--accent);font-size:13px}ul{list-style:none;padding:0;margin:0}.row{display:grid;grid-template-columns:minmax(120px,1fr) auto;gap:10px;padding:11px 0;border-top:1px solid #29363a}.row:first-child{border-top:0}.row-title{font-weight:650;overflow-wrap:anywhere}.row-meta{color:var(--muted);font-size:13px}.bar{height:6px;background:#2b393d;border-radius:8px;overflow:hidden;margin-top:8px}.bar i{display:block;height:100%;background:var(--accent);border-radius:8px}.empty{padding:16px 0;color:var(--muted)}details{border-top:1px solid #29363a;padding:13px 0}details:first-of-type{border-top:0}summary{cursor:pointer;list-style:none;display:flex;justify-content:space-between;gap:14px;align-items:center}summary::-webkit-details-marker{display:none}summary:after{content:"＋";color:var(--accent);font-size:18px}details[open] summary:after{content:"－"}.match-title{font-weight:650}.match-sub{font-size:13px;color:var(--muted)}.table-wrap{overflow:auto;margin-top:12px}table{width:100%;border-collapse:collapse;min-width:500px;font-size:14px}th,td{text-align:left;padding:9px 10px;border-bottom:1px solid #29363a}th{color:var(--muted);font-weight:550}.pill{display:inline-block;border:1px solid #45625c;border-radius:20px;padding:2px 9px;color:#b3e8d9;font-size:12px}.foot{margin-top:16px;text-align:right;color:var(--muted);font-size:12px}@media(max-width:560px){main{width:calc(100% - 20px);margin-top:22px}.card{padding:14px}section{padding:15px}.section-head{align-items:flex-start;flex-direction:column}}
  </style>
</head>
<body>
  <main>
    <header><svg viewBox="0 0 48 48" fill="none" aria-hidden="true"><path d="M7 34h8V20H7v14Zm13 0h8V11h-8v23Zm13 0h8V16h-8v18Z" stroke="currentColor" stroke-width="3"/><path d="m7 14 10-5 8 2 13-7" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg><div><h1>对局服务状态</h1><p class="sub">实例负载、实时房间与最终结算</p></div></header>
    <div class="grid" id="overview"><article class="card"><div class="label">实例在线</div><div class="value">读取中</div></article></div>
    <section><div class="section-head"><h2>比赛实例</h2><span class="tag">当前负载</span></div><ul id="instances" class="empty">正在读取状态…</ul></section>
    <section><div class="section-head"><h2>匹配队列</h2><span class="tag">等待中的玩家</span></div><div id="queues" class="empty">正在读取状态…</div></section>
    <section><div class="section-head"><h2>等待房间</h2><span class="tag">玩家席 / 容量</span></div><ul id="rooms" class="empty">正在读取状态…</ul></section>
    <section><div class="section-head"><h2>进行中对局</h2><span class="tag">实时列表</span></div><ul id="matches" class="empty">正在读取状态…</ul></section>
    <section><div class="section-head"><h2>最近完成的对局</h2><span class="tag" id="history-count">最近 100 场</span></div><div id="history" class="empty">正在读取结算记录…</div></section>
    <p class="foot" id="updated">页面每 5 秒刷新</p>
  </main>
  <script>
    const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const fmtDate=s=>{const d=new Date(s);return Number.isNaN(d.getTime())?'时间未知':d.toLocaleString('zh-CN',{hour12:false})};
    const fmtDuration=n=>{n=Math.max(0,Math.floor((Number(n)||0)/1000));return n>=3600?`${Math.floor(n/3600)}小时${Math.floor(n%3600/60)}分`:n>=60?`${Math.floor(n/60)}分${n%60}秒`:`${n}秒`};
    const empty=(id,msg)=>{document.getElementById(id).innerHTML=`<li class="empty">${esc(msg)}</li>`};
    function show(data){
      const inst=data.instances||[], online=inst.filter(x=>x.up).length, gateway=data.gateway||{}, rooms=data.rooms||[], history=data.history||[];
      document.getElementById('overview').innerHTML=[['实例在线',`${online} <span class="unit">/ ${inst.length}</span>`],['进行中对局',`${esc(gateway.playing||0)} <span class="unit">场</span>`],['大厅连接',`${esc(gateway.sessions||0)} <span class="unit">个</span>`],['中继连接',`${esc(gateway.relays||0)} <span class="unit">个</span>`],['等待房间',`${rooms.length} <span class="unit">间</span>`],['错误报告',`${esc(gateway.reports||0)} <span class="unit">份</span>`]].map(([k,v])=>`<article class="card"><div class="label">${k}</div><div class="value">${v}</div></article>`).join('');
      if(inst.length)document.getElementById('instances').innerHTML=inst.map(x=>`<li class="row"><div><div class="row-title"><i class="dot ${x.up?'up':''}"></i>实例 ${esc(x.port)}</div><div class="row-meta">${x.up?`进程 ${esc(x.pid||'—')} · ${esc(x.players||0)} 名玩家`:'暂不可用'}</div></div><div>${x.up?`${esc(x.matches||0)} 场`:'—'}</div></li>`).join('');else empty('instances','没有配置比赛实例');
      const queues=gateway.queues||{};document.getElementById('queues').innerHTML=Object.keys(queues).length?Object.entries(queues).map(([mode,names])=>`<div class="row"><div><div class="row-title">${esc(mode==='multiStandMatch'?'竞猜对决':'礼物对决')}</div><div class="row-meta">${(names||[]).map(esc).join('、')||'暂无等待玩家'}</div></div><span class="pill">${(names||[]).length} 人</span></div>`).join(''):'<p class="empty">没有等待队列</p>';
      if(rooms.length)document.getElementById('rooms').innerHTML=rooms.map(x=>{const count=(x.members||[]).length,max=Number(x.max)||0;return `<li class="row"><div><div class="row-title">${esc(x.code||'房间')} · ${esc(x.mode)}</div><div class="row-meta">房主：${esc(x.host||'未知')} · ${esc((x.members||[]).join('、')||'暂无玩家')} · 观战 ${esc(x.spectators||0)} 人</div><div class="bar"><i style="width:${max?Math.min(100,count/max*100):0}%"></i></div></div><span class="pill">${count} / ${max||'—'} 人</span></li>`}).join('');else empty('rooms','当前没有等待房间');
      const active=inst.flatMap(x=>(x.list||[]).map(m=>({...m,port:x.port})));if(active.length)document.getElementById('matches').innerHTML=active.map(m=>{const seats=Number(m.seats)||0,max=Number(m.max)||0;return `<li class="row"><div><div class="row-title">${esc(m.mode)} · 第 ${esc(m.round||0)} 轮</div><div class="row-meta">实例 ${esc(m.port)} · ${(m.humans||[]).map(esc).join('、')||'暂无玩家'}</div><div class="bar"><i style="width:${max?Math.min(100,seats/max*100):0}%"></i></div></div><span class="pill">${esc(m.phase||'进行中')} · ${seats} / ${max||'—'}</span></li>`}).join('');else empty('matches','当前没有进行中的对局');
      document.getElementById('history-count').textContent=`${history.length} 场`;
      document.getElementById('history').innerHTML=history.length?history.map(m=>`<details><summary><span><span class="match-title">${esc(m.mode)} · ${m.participants.length} 名参与者</span><br><span class="match-sub">${esc(fmtDate(m.endedAt))} · ${esc(fmtDuration(m.durationMs))} · ${esc(m.rounds)} 轮</span></span></summary><div class="table-wrap"><table><thead><tr><th>排名</th><th>参与者</th><th>最终得分</th><th>公开统计</th></tr></thead><tbody>${m.participants.slice().sort((a,b)=>(a.rank||999)-(b.rank||999)).map(p=>{const labels={all:'全力支持',normal:'常规支持',skip:'观望',forced:'强制支持'};const stats=[...Object.entries(p.stats||{}).map(([k,v])=>`${labels[k]||k} ${v}`),...(p.pass!==undefined?[`正确 ${p.pass}`]:[]),...(p.shield!==undefined?[`保护 ${p.shield}`]:[]),...(p.streak!==undefined?[`连胜 ${p.streak}`]:[])].join(' · ');return `<tr><td>${esc(p.rank??'—')}</td><td>${esc(p.name)}</td><td>${esc(p.score??'—')}</td><td>${esc(stats||'—')}</td></tr>`}).join('')}</tbody></table></div></details>`).join(''):'<p class="empty">还没有完成的对局</p>';
      document.getElementById('updated').textContent=`最后更新：${new Date().toLocaleTimeString('zh-CN',{hour12:false})} · 每 5 秒刷新`;
    }
    async function refresh(){try{const r=await fetch('/status.json',{cache:'no-store'});if(!r.ok)throw new Error('状态不可用');show(await r.json());}catch(e){document.getElementById('updated').textContent=`读取状态失败：${e.message} · 将自动重试`;}}
    refresh();setInterval(refresh,5000);
  </script>
</body>
</html>
