map $http_upgrade $duel_connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name duel.priestess.wiki;
    return 308 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name duel.priestess.wiki;

    ssl_certificate /www/sites/wei.priestess.wiki/ssl/fullchain.pem;
    ssl_certificate_key /www/sites/wei.priestess.wiki/ssl/privkey.pem;

    client_max_body_size 128k;

    location ^~ /status {
        return 404;
    }

    location / {
        proxy_pass http://127.0.0.1:8600;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $duel_connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
