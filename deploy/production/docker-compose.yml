services:
  duel-channel:
    image: duel-channel:prod
    container_name: duel-channel
    restart: unless-stopped
    init: true
    environment:
      TRUST_PROXY: "1"
    ports:
      - "127.0.0.1:8600:8600"
    volumes:
      - duel_logs:/app/logs
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    cpus: 0.75
    mem_limit: 512m
    memswap_limit: 512m
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

volumes:
  duel_logs:
